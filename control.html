<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1b0a34">
<title>Baba Ji Control</title>

<link rel="icon" href="assets/BabaJi_Control_Icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/BabaJi_Control_Icon.png">
<link rel="apple-touch-icon" href="assets/BabaJi_Control_Icon.png">

<script src="firebase-config.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:18px;
 background:radial-gradient(circle at top,#55247d,#160725 70%);
 font-family:system-ui,Arial;color:#fff
}
.card{
 max-width:480px;margin:5vh auto;padding:20px;
 border:2px solid #e5b64e;border-radius:22px;
 background:linear-gradient(145deg,#381957,#160a2b);
 box-shadow:0 0 25px #e63eaa66
}
.appicon{
 display:block;width:122px;height:122px;object-fit:cover;
 margin:0 auto 10px;border-radius:23px;
 box-shadow:0 0 18px #ffc94b88
}
.title{
 text-align:center;font-size:30px;font-weight:1000;
 color:#ffe08a;text-shadow:0 0 14px #ee3db4
}
.field,select{
 display:block;width:100%;margin:8px 0 14px;padding:12px;
 border:1px solid #d7a5e8;border-radius:12px;
 background:#fff4df;color:#26113b;font-size:16px
}
label{font-weight:800;color:#ffe3a1}
button{
 width:100%;margin:6px 0;padding:12px;
 border:1px solid #ffe9a2;border-radius:14px;
 background:linear-gradient(120deg,#fff08a,#ffb52d);
 color:#311342;font-weight:900;font-size:15px
}
button:disabled{opacity:.4}
.small{font-size:12px;color:#e8d5f5;line-height:1.5}
.players{
 margin:12px 0;padding:10px;border-radius:14px;
 background:#ffffff12
}
.player{padding:8px;border-bottom:1px solid #ffffff22}
.status{color:#ffdf6a;font-weight:800;min-height:24px}
</style>
</head>

<body>

<div class="card">

<img class="appicon" src="assets/BabaJi_Control_Icon.png" alt="Baba Ji Control icon">

<div class="title">🎛️ Baba Ji Control</div>

<p class="small">
गेम वाले रूम से कनेक्ट करें। Admin Fun Control से बिना Player Approval के Force 6 और Fun Effects भेजें।
</p>

<label>Room PIN</label>
<input id="room" class="field" value="2003" inputmode="numeric">

<button id="connect">🔗 Connect Room</button>

<div class="status" id="status">अभी कनेक्ट नहीं है।</div>

<div class="players" id="players">खिलाड़ी सूची यहाँ दिखेगी।</div>

<label>किस खिलाड़ी पर?</label>
<select id="target" class="field"></select>

<label>इफेक्ट</label>
<select id="effect" class="field">
<option value="force6">🎲 अगले पासे में 6 (Force 6)</option>
<option value="glow">✨ चमकदार गोटी</option>
<option value="dance">🕺 डांस इफेक्ट</option>
<option value="cheer">🎉 Celebration</option>
<option value="voice">😂 Funny आवाज़</option>
</select>

<button id="send" disabled>🎊 इफेक्ट / Force 6 भेजें</button>

<p class="small" id="votes">
Admin Fun Control चालू — Player Approval जरूरी नहीं।
</p>

</div>

<script>

const $ = id => document.getElementById(id);

let db = null;
let ref = null;
let uid = null;
let lastData = null;

function load(url){
 return new Promise((resolve,reject)=>{
  const s = document.createElement('script');
  s.src = url;
  s.onload = resolve;
  s.onerror = reject;
  document.head.appendChild(s);
 });
}

async function connect(){

 try{

  $('status').textContent = 'कनेक्ट हो रहा है...';

  const code = $('room').value.trim();

  if(!/^\d{4,8}$/.test(code)){
   throw Error('Room PIN 4 से 8 अंकों का रखें।');
  }

  const c = window.BABA_FIREBASE_CONFIG;

  if(!c || !c.apiKey || c.apiKey.includes('PASTE_')){
   throw Error('पहले firebase-config.js सेट करें।');
  }

  if(!window.firebase){
   await load('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
   await load('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js');
   await load('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');
  }

  if(!firebase.apps.length){
   firebase.initializeApp(c);
  }

  const u = await firebase.auth().signInAnonymously();

  uid = u.user.uid;
  db = firebase.database();

  if(ref){
   ref.off();
  }

  ref = db.ref('babaJiLudoRooms/' + code);

  ref.on('value', snapshot=>{
   render(snapshot.val());
  });

  $('status').textContent = '✅ Room Connected!';

 }catch(e){

  $('status').textContent = '⚠️ ' + e.message;

 }

}

function render(d){

 lastData = d;

 if(!d || !d.started){

  $('players').textContent = 'रूम अभी शुरू नहीं हुआ है।';
  $('target').replaceChildren();
  $('send').disabled = true;

  return;
 }

 const ps = d.players || [];

 const playerList = $('players');
 const target = $('target');

 playerList.replaceChildren();
 target.replaceChildren();

 ps.forEach((p,i)=>{

  const label = p.name || 'Player ' + (i+1);

  const item = document.createElement('div');

  item.className = 'player';

  item.textContent =
   `${p.avatar || '🙂'} ${label} — ${['लाल','हरा','पीला','नीला'][p.colorIndex] || ''}`;

  playerList.appendChild(item);

  const option = document.createElement('option');

  option.value = String(i);
  option.textContent = label;

  target.appendChild(option);

 });

 $('votes').textContent =
  '✅ Admin Fun Control चालू — Approval जरूरी नहीं।';

 $('send').disabled = ps.length === 0;

 $('status').textContent =
  ps.length > 0
   ? '✅ Fun Control चालू — इफेक्ट भेज सकते हैं।'
   : 'रूम में कोई खिलाड़ी नहीं है।';

}

$('connect').onclick = connect;

$('send').onclick = async()=>{

 try{

  if(!lastData || !lastData.started){
   $('status').textContent = '⚠️ गेम शुरू नहीं हुआ है।';
   return;
  }

  const ps = lastData.players || [];

  if(ps.length === 0){
   $('status').textContent = '⚠️ कोई खिलाड़ी नहीं मिला।';
   return;
  }

  const target = Number($('target').value);
  const effect = $('effect').value;

  if(!Number.isInteger(target) || !ps[target]){
   $('status').textContent = '⚠️ खिलाड़ी चुनें।';
   return;
  }

  if(effect === 'force6'){

   const id = Date.now();

   await ref.update({

    pendingDiceOverride:{
     id:id,
     target:target,
     value:6,
     by:uid
    },

    lastActionBy:uid

   });

   $('status').textContent =
    '🎲 Force 6 भेज दिया गया!';

  }else{

   const ev = {

    id:Date.now(),
    target:target,
    effect:effect,
    by:uid

   };

   await ref.update({

    funEvent:ev,
    lastActionBy:uid

   });

   $('status').textContent =
    '🎉 Fun Effect भेज दिया गया!';

  }

 }catch(e){

  $('status').textContent =
   '⚠️ Error: ' + e.message;

 }

};

</script>

</body>
  </html>
